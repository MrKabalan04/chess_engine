[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The Emscripten WebAssembly engine must be served with the right MIME type
# and cached aggressively (it is content-addressed only by manual rebuilds).
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/luna.js"
  [headers.values]
    Cache-Control = "no-cache"

# Single-page app fallback: any unknown path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200